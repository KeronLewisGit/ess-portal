# ESS Portal — local development stack (PHP-FPM + nginx + MySQL 8 + Mailpit).
# Frontend assets are built on the HOST with Node/npm (no Node in containers).
#
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
#   App:      http://localhost:8080
#   Mailpit:  http://localhost:8025

services:
  app:
    build:
      context: ./docker/php
    container_name: ess-portal-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      # Keep container-side overrides minimal; .env is the source of truth.
      PHP_IDE_CONFIG: serverName=ess-portal
    depends_on:
      mysql:
        condition: service_healthy
    networks: [ess]

  nginx:
    image: nginx:1.27-alpine
    container_name: ess-portal-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [ess]

  mysql:
    image: mysql:8.0
    container_name: ess-portal-mysql
    environment:
      MYSQL_DATABASE: ess_portal
      MYSQL_USER: ess
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Exposed for host DB tools; the app connects via the internal network.
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ess]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ess-portal-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks: [ess]

networks:
  ess:
    driver: bridge

volumes:
  mysql-data:
